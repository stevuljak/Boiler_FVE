; Boiler_FVE — záznam teploty boileru
; Arduino UNO + TZT Data Logger Shield V1.0 + LCD 1602 Keypad
;
; Build / nahrání:
;   pio run
;   pio run -t upload
;   pio run -t monitor
;
; Graf v prohlížeči (USB, zavři monitor):
;   pip install -r requirements.txt
;   python web/server.py

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
  -DSERIAL_RX_BUFFER_SIZE=32
  -DSERIAL_TX_BUFFER_SIZE=32
extra_scripts =
  pre:scripts/patch_sd_cs.py
lib_deps =
  arduino-libraries/LiquidCrystal@^1.0.7
  arduino-libraries/SD@^1.3.0
  paulstoffregen/OneWire@^2.3.8
  paulstoffregen/Time@^1.6.1
  https://github.com/PaulStoffregen/DS1307RTC.git
